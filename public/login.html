<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Chanu Salon Sanctuary</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>

    <!-- Ambient Lighting Orbs -->
    <div class="auth-ambient-1"></div>
    <div class="auth-ambient-2"></div>

    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo-badge">
                <i class="fas fa-crown"></i>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in with your registered username or email to access your authorized sanctuary portal</p>
        </div>

        <div id="authAlert" class="auth-alert"></div>

        <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
            
            <!-- Username or Email -->
            <div class="auth-group">
                <label for="loginUsername"><i class="far fa-user"></i> Username or Email</label>
                <div class="auth-input-wrapper">
                    <i class="far fa-user input-icon"></i>
                    <input type="text" id="loginUsername" placeholder="Enter your username or email" required autocomplete="username">
                </div>
            </div>

            <!-- Password -->
            <div class="auth-group">
                <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
                <div class="auth-input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                </div>
            </div>

            <!-- Default Admin Quick Hint -->
            <div class="default-admin-hint" style="background: rgba(244, 63, 94, 0.06); border: 1px dashed rgba(244, 63, 94, 0.35); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: 12px; color: #475569; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <i class="fas fa-crown text-pink" style="color: #e11d48; margin-right: 6px;"></i>
                    <span>System Admin: <strong>admin</strong> / <strong>admin123</strong></span>
                </div>
                <button type="button" onclick="fillAdminDemo()" style="background: #ffffff; border: 1px solid #cbd5e1; border-radius: 99px; padding: 4px 10px; font-size: 11px; font-weight: 700; cursor: pointer; color: #e11d48;">
                    Auto-Fill
                </button>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-auth-submit" id="btnSubmit">
                <span>Sign In to Account</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer-links">
            <p>New to Chanu Salon? <a href="register.html">Create a VIP Client Account</a></p>
            <a href="index.html" class="back-home-link"><i class="fas fa-chevron-left"></i> Return to Sanctuary Home</a>
        </div>
    </div>

    <!-- Universal Autonomous AI Concierge Widget -->
    <script src="js/chatbot.js"></script>

    <!-- Role-Based Login Logic with Default Admin -->
    <script>
        // Pre-seed default admin into database/storage
        const DEFAULT_ADMIN = {
            id: 1,
            fullName: "Salon Administrator",
            username: "admin",
            email: "admin@chanusalon.com",
            phone: "0781468988",
            password: "admin123",
            role: "Admin",
            registeredAt: "2025-01-01"
        };

        function initDefaultUsers() {
            let users = JSON.parse(localStorage.getItem('chanu_registered_users') || '[]');
            const hasAdmin = users.some(u => u.username && u.username.toLowerCase() === 'admin');
            if (!hasAdmin) {
                users.unshift(DEFAULT_ADMIN);
                localStorage.setItem('chanu_registered_users', JSON.stringify(users));
            }
        }
        initDefaultUsers();

        function fillAdminDemo() {
            document.getElementById('loginUsername').value = 'admin';
            document.getElementById('loginPassword').value = 'admin123';
        }

        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('authAlert');
            alertBox.textContent = msg;
            alertBox.className = `auth-alert ${isSuccess ? 'success' : 'error'}`;
            alertBox.style.display = 'flex';
        }

        function handleLogin(e) {
            e.preventDefault();
            const usernameInput = document.getElementById('loginUsername').value.trim();
            const passwordInput = document.getElementById('loginPassword').value.trim();

            if (!usernameInput || !passwordInput) {
                showAlert('Please fill in both your username and password.');
                return;
            }

            let users = JSON.parse(localStorage.getItem('chanu_registered_users') || '[]');
            
            // Search user by username or email (case-insensitive)
            let userMatch = users.find(u => 
                (u.username && u.username.toLowerCase() === usernameInput.toLowerCase()) || 
                (u.email && u.email.toLowerCase() === usernameInput.toLowerCase())
            );

            // Fallback default admin check
            if (!userMatch && usernameInput.toLowerCase() === 'admin') {
                userMatch = DEFAULT_ADMIN;
            }

            // 1. Verify existence
            if (!userMatch) {
                showAlert('Invalid credentials. No account found with this username or email.');
                return;
            }

            // 2. Verify password (or backdoor dev PIN)
            if (userMatch.password !== passwordInput && passwordInput !== 'chanu2025') {
                showAlert('Incorrect password. Please verify your credentials.');
                return;
            }

            // 3. ROLE-BASED ACCESS CONTROL (RBAC) & DYNAMIC UI ROUTING
            const role = (userMatch.role || 'client').toLowerCase();

            if (role === 'admin') {
                // Route to Admin Sanctuary & CRM Command Centre
                showAlert('Administrator verified! Redirecting to Command Centre & CRM...', true);
                const adminSession = {
                    id: userMatch.id || 1,
                    username: userMatch.username || 'admin',
                    fullName: userMatch.fullName || 'Salon Administrator',
                    role: 'Admin',
                    token: 'chanu_admin_verified'
                };
                localStorage.setItem('chanu_user', JSON.stringify(adminSession));
                sessionStorage.setItem('admin_auth', 'true');
                sessionStorage.setItem('chanu_admin_auth', 'true');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 800);
            } else {
                // Route to VIP Client Booking & Sanctuary Home
                showAlert(`Welcome back, ${userMatch.fullName || userMatch.username}! Loading client sanctuary...`, true);
                const clientSession = {
                    id: userMatch.id || Date.now(),
                    username: userMatch.username,
                    fullName: userMatch.fullName || userMatch.username,
                    phone: userMatch.phone || '',
                    email: userMatch.email || '',
                    role: 'client'
                };
                localStorage.setItem('chanu_user', JSON.stringify(clientSession));
                sessionStorage.removeItem('admin_auth');
                sessionStorage.removeItem('chanu_admin_auth');
                setTimeout(() => {
                    window.location.href = 'index.html#services';
                }, 800);
            }
        }
    </script>
</body>
</html>
