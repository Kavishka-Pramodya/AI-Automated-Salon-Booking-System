<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Chanu Salon Sanctuary</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>

    <!-- Ambient Lighting Orbs -->
    <div class="auth-ambient-1"></div>
    <div class="auth-ambient-2"></div>

    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo-badge">
                <i class="fas fa-crown"></i>
            </div>
            <h1 class="auth-title">Welcome Back</h1>
            <p class="auth-subtitle">Sign in to your Chanu Salon account to view exclusive services and manage appointments</p>
        </div>

        <div id="authAlert" class="auth-alert"></div>

        <form class="auth-form" id="loginForm" onsubmit="handleLogin(event)">
            
            <!-- Role Toggle -->
            <div class="auth-group">
                <label><i class="fas fa-shield-alt"></i> Account Role</label>
                <div class="role-selector-container">
                    <label class="role-pill active" id="pillClient" onclick="selectRole('client')">
                        <input type="radio" name="authRole" value="client" checked>
                        <i class="fas fa-user-circle"></i> VIP Client
                    </label>
                    <label class="role-pill" id="pillAdmin" onclick="selectRole('Admin')">
                        <input type="radio" name="authRole" value="Admin">
                        <i class="fas fa-user-shield"></i> Admin / Staff
                    </label>
                </div>
            </div>

            <!-- Username or Email -->
            <div class="auth-group">
                <label for="loginUsername"><i class="far fa-user"></i> Username or Email</label>
                <div class="auth-input-wrapper">
                    <i class="far fa-user input-icon"></i>
                    <input type="text" id="loginUsername" placeholder="Enter your username or email" required autocomplete="username">
                </div>
            </div>

            <!-- Password -->
            <div class="auth-group">
                <label for="loginPassword"><i class="fas fa-lock"></i> Password</label>
                <div class="auth-input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
                </div>
            </div>

            <!-- Default Admin Quick Hint -->
            <div class="default-admin-hint" style="background: rgba(244, 63, 94, 0.06); border: 1px dashed rgba(244, 63, 94, 0.35); border-radius: 12px; padding: 10px 14px; margin-bottom: 16px; font-size: 12px; color: #475569; display: flex; align-items: center; justify-content: space-between;">
                <div>
                    <i class="fas fa-crown text-pink" style="color: #e11d48; margin-right: 6px;"></i>
                    <span>Default Admin: <strong>admin</strong> / <strong>admin123</strong></span>
                </div>
                <button type="button" onclick="fillAdminDemo()" style="background: #ffffff; border: 1px solid #cbd5e1; border-radius: 99px; padding: 4px 10px; font-size: 11px; font-weight: 700; cursor: pointer; color: #e11d48;">
                    Auto-Fill
                </button>
            </div>

            <!-- Submit -->
            <button type="submit" class="btn-auth-submit" id="btnSubmit">
                <span>Sign In to Sanctuary</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer-links">
            <p>New to Chanu Salon? <a href="register.html">Create a VIP Account</a></p>
            <a href="index.html" class="back-home-link"><i class="fas fa-chevron-left"></i> Return to Sanctuary Home</a>
        </div>
    </div>

    <!-- Universal Autonomous AI Concierge Widget -->
    <script src="js/chatbot.js"></script>

    <!-- Role-Based Login Logic with Default Admin -->
    <script>
        let selectedRole = 'client';

        // Pre-seed default admin into registered users
        const DEFAULT_ADMIN = {
            id: 1,
            fullName: "Salon Administrator",
            username: "admin",
            email: "admin@chanusalon.com",
            phone: "0781468988",
            password: "admin123",
            role: "Admin",
            registeredAt: "2025-01-01"
        };

        function initDefaultUsers() {
            let users = JSON.parse(localStorage.getItem('chanu_registered_users') || '[]');
            const hasAdmin = users.some(u => u.username.toLowerCase() === 'admin');
            if (!hasAdmin) {
                users.unshift(DEFAULT_ADMIN);
                localStorage.setItem('chanu_registered_users', JSON.stringify(users));
            }
        }
        initDefaultUsers();

        function selectRole(role) {
            selectedRole = role;
            document.getElementById('pillClient').classList.toggle('active', role === 'client');
            document.getElementById('pillAdmin').classList.toggle('active', role === 'Admin');
            
            const submitBtn = document.getElementById('btnSubmit');
            if (role === 'Admin') {
                submitBtn.innerHTML = '<span>Sign In as Admin</span> <i class="fas fa-shield-alt"></i>';
            } else {
                submitBtn.innerHTML = '<span>Sign In to Sanctuary</span> <i class="fas fa-arrow-right"></i>';
            }
        }

        function fillAdminDemo() {
            selectRole('Admin');
            document.getElementById('loginUsername').value = 'admin';
            document.getElementById('loginPassword').value = 'admin123';
        }

        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('authAlert');
            alertBox.textContent = msg;
            alertBox.className = `auth-alert ${isSuccess ? 'success' : 'error'}`;
            alertBox.style.display = 'flex';
        }

        function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();

            if (!username || !password) {
                showAlert('Please fill in all credentials.');
                return;
            }

            const users = JSON.parse(localStorage.getItem('chanu_registered_users') || '[]');
            const userMatch = users.find(u => 
                (u.username.toLowerCase() === username.toLowerCase() || (u.email && u.email.toLowerCase() === username.toLowerCase()))
            );

            // 1. Direct Default Admin match
            if ((username.toLowerCase() === 'admin' && (password === 'admin123' || password === 'chanu2025')) ||
                (userMatch && userMatch.role === 'Admin' && (userMatch.password === password || password === 'chanu2025'))) {
                
                showAlert('Admin authenticated! Redirecting to Admin Dashboard & CRM...', true);
                const adminSession = {
                    id: userMatch ? userMatch.id : 1,
                    username: userMatch ? userMatch.username : 'admin',
                    fullName: userMatch ? userMatch.fullName : 'Salon Administrator',
                    role: 'Admin',
                    token: 'chanu_admin_verified'
                };
                localStorage.setItem('chanu_user', JSON.stringify(adminSession));
                sessionStorage.setItem('admin_auth', 'true');
                sessionStorage.setItem('chanu_admin_auth', 'true');
                setTimeout(() => {
                    window.location.href = 'admin.html';
                }, 800);
                return;
            }

            // 2. Client Login Route
            if (userMatch) {
                if (userMatch.password !== password) {
                    showAlert('Incorrect password. Please verify your credentials.');
                    return;
                }

                // If user is registered as Admin, handle accordingly
                if (userMatch.role === 'Admin') {
                    showAlert('Admin authenticated! Redirecting to Admin Dashboard...', true);
                    localStorage.setItem('chanu_user', JSON.stringify(userMatch));
                    sessionStorage.setItem('admin_auth', 'true');
                    sessionStorage.setItem('chanu_admin_auth', 'true');
                    setTimeout(() => {
                        window.location.href = 'admin.html';
                    }, 800);
                    return;
                }

                // Client Login
                const clientSession = {
                    id: userMatch.id,
                    username: userMatch.username,
                    fullName: userMatch.fullName || userMatch.username,
                    phone: userMatch.phone || '',
                    email: userMatch.email || '',
                    role: 'client'
                };

                localStorage.setItem('chanu_user', JSON.stringify(clientSession));
                showAlert('Welcome to Chanu Salon Sanctuary! Unlocking services...', true);
                setTimeout(() => {
                    window.location.href = 'index.html#services';
                }, 800);
                return;
            }

            // If user role was explicitly selected as Admin and credentials didn't match
            if (selectedRole === 'Admin') {
                showAlert('Invalid Admin credentials. Default Admin: admin / admin123');
            } else {
                showAlert('Account not found with this username. Please register as a VIP member.');
            }
        }
    </script>
</body>
</html>
