<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Member Registration | Chanu Salon Sanctuary</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/chatbot.css">
</head>
<body>

    <!-- Ambient Lighting Orbs -->
    <div class="auth-ambient-1"></div>
    <div class="auth-ambient-2"></div>

    <div class="auth-card" style="max-width: 500px;">
        <div class="auth-header">
            <div class="auth-logo-badge">
                <i class="fas fa-sparkles"></i>
            </div>
            <h1 class="auth-title">Create VIP Account</h1>
            <p class="auth-subtitle">Register for your Chanu Salon VIP membership to unlock master styling appointments and bespoke slot booking</p>
        </div>

        <div id="authAlert" class="auth-alert"></div>

        <form class="auth-form" id="registerForm" onsubmit="handleRegister(event)">
            
            <!-- Full Name -->
            <div class="auth-group">
                <label for="regFullName"><i class="far fa-user"></i> Full Name</label>
                <div class="auth-input-wrapper">
                    <i class="far fa-user input-icon"></i>
                    <input type="text" id="regFullName" placeholder="e.g. Anuki Perera" required>
                </div>
            </div>

            <!-- Phone & Username in 2 columns -->
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 14px;">
                <div class="auth-group">
                    <label for="regPhone"><i class="fas fa-phone"></i> Phone / WhatsApp</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" id="regPhone" placeholder="071XXXXXXX" required pattern="[0-9]{10}">
                    </div>
                </div>
                <div class="auth-group">
                    <label for="regUsername"><i class="fas fa-at"></i> Username</label>
                    <div class="auth-input-wrapper">
                        <i class="fas fa-at input-icon"></i>
                        <input type="text" id="regUsername" placeholder="e.g. anuki24" required>
                    </div>
                </div>
            </div>

            <!-- Email -->
            <div class="auth-group">
                <label for="regEmail"><i class="far fa-envelope"></i> Email Address</label>
                <div class="auth-input-wrapper">
                    <i class="far fa-envelope input-icon"></i>
                    <input type="email" id="regEmail" placeholder="anuki@example.com" required>
                </div>
            </div>

            <!-- Password -->
            <div class="auth-group">
                <label for="regPassword"><i class="fas fa-lock"></i> Password</label>
                <div class="auth-input-wrapper">
                    <i class="fas fa-lock input-icon"></i>
                    <input type="password" id="regPassword" placeholder="Create a secure password" required minlength="4">
                </div>
            </div>

            <!-- Notice -->
            <div style="font-size: 11.5px; color: #94a3b8; margin: -6px 0 16px 2px; line-height: 1.4;">
                <i class="fas fa-shield-alt" style="color: #f43f5e; margin-right: 4px;"></i> Public registrations are for VIP Clients only. Admin accounts are provisioned by salon management.
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-auth-submit" id="btnRegSubmit">
                <span>Complete VIP Registration</span>
                <i class="fas fa-arrow-right"></i>
            </button>
        </form>

        <div class="auth-footer-links">
            <p>Already have an account? <a href="login.html">Sign In here</a></p>
            <a href="index.html" class="back-home-link"><i class="fas fa-chevron-left"></i> Return to Sanctuary Home</a>
        </div>
    </div>

    <!-- Universal Autonomous AI Concierge Widget -->
    <script src="js/chatbot.js"></script>

    <!-- Client-Only Registration Logic -->
    <script>
        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('authAlert');
            alertBox.textContent = msg;
            alertBox.className = `auth-alert ${isSuccess ? 'success' : 'error'}`;
            alertBox.style.display = 'flex';
        }

        function handleRegister(e) {
            e.preventDefault();
            const fullName = document.getElementById('regFullName').value.trim();
            const phone = document.getElementById('regPhone').value.trim();
            const username = document.getElementById('regUsername').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value.trim();

            if (!fullName || !phone || !username || !password) {
                showAlert('Please fill in all required fields.');
                return;
            }

            // Retrieve existing users
            const users = JSON.parse(localStorage.getItem('chanu_registered_users') || '[]');
            const exists = users.some(u => u.username.toLowerCase() === username.toLowerCase());
            if (exists) {
                showAlert('Username is already taken. Please choose another username.');
                return;
            }

            // Register new VIP Client
            const newUser = {
                id: Date.now(),
                fullName: fullName,
                phone: phone,
                email: email,
                username: username,
                password: password,
                role: 'client',
                registeredAt: new Date().toISOString()
            };

            users.push(newUser);
            localStorage.setItem('chanu_registered_users', JSON.stringify(users));

            // Set active session
            localStorage.setItem('chanu_user', JSON.stringify({
                fullName: fullName,
                phone: phone,
                email: email,
                username: username,
                role: 'client'
            }));

            showAlert('VIP Account created successfully! Unlocking services...', true);
            setTimeout(() => {
                window.location.href = 'index.html#services';
            }, 900);
        }
    </script>
</body>
</html>
